<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Robo Rumble component placement</title>
<desc id="desc">Dimensioned concept drawing with top view of chassis component locations and side view of low battery and center of gravity.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs>
<rect width="1100" height="760" fill="#f8fafc"/>
<text x="40" y="42" font-family="Arial" font-size="28" font-weight="bold" fill="#111827">Robo Rumble — component placement concept</text>
<text x="55" y="88" font-family="Arial" font-size="20" font-weight="bold" fill="#0f172a">TOP VIEW • dimensions in mm • not to fabrication scale</text>
<!-- chassis plate 300 x 240 -->
<rect x="170" y="145" width="300" height="240" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
<text x="265" y="162" font-family="Arial" font-size="15" fill="#1e3a8a">Chassis plate: 300 × 240</text>
<!-- wheels 70 dia, 30 width, track 270, wheelbase 260 -->
<g fill="#334155" stroke="#0f172a" stroke-width="3">
 <rect x="155" y="115" width="70" height="30" rx="11"/><rect x="415" y="115" width="70" height="30" rx="11"/>
 <rect x="155" y="385" width="70" height="30" rx="11"/><rect x="415" y="385" width="70" height="30" rx="11"/>
</g>
<g font-family="Arial" font-size="12" fill="white"><text x="164" y="143">LF wheel</text><text x="423" y="143">RF wheel</text><text x="164" y="399">LR wheel</text><text x="423" y="399">RR wheel</text></g>
<!-- motor pods inside corners -->
<g fill="#fca5a5" stroke="#b91c1c" stroke-width="2">
 <rect x="225" y="170" width="46" height="36" rx="5"/><rect x="369" y="170" width="46" height="36" rx="5"/>
 <rect x="225" y="324" width="46" height="36" rx="5"/><rect x="369" y="324" width="46" height="36" rx="5"/>
</g>
<g font-family="Arial" font-size="12" fill="#7f1d1d"><text x="231" y="192">LF motor</text><text x="375" y="192">RF motor</text><text x="231" y="346">LR motor</text><text x="375" y="346">RR motor</text></g>
<!-- battery central low -->
<rect x="265" y="232" width="110" height="70" rx="8" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
<text x="285" y="260" font-family="Arial" font-size="16" font-weight="bold" fill="#451a03">3S battery</text><text x="277" y="282" font-family="Arial" font-size="13" fill="#451a03">heaviest part • low</text>
<!-- CG marker -->
<circle cx="320" cy="267" r="11" fill="#dc2626" stroke="white" stroke-width="3"/><line x1="320" y1="267" x2="320" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="329" y="220" font-family="Arial" font-size="13" font-weight="bold" fill="#991b1b">CG target near center</text>
<!-- top plate electronics dotted outlines -->
<g fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3">
 <rect x="275" y="177" width="82" height="28" rx="4"/><rect x="276" y="307" width="80" height="26" rx="4"/>
 <rect x="277" y="211" width="36" height="16" rx="3"/><rect x="318" y="211" width="36" height="16" rx="3"/>
</g>
<g font-family="Arial" font-size="11" fill="#5b21b6"><text x="284" y="196">upper deck: ESP32</text><text x="284" y="324">buck + fuse</text><text x="279" y="223">L driver</text><text x="321" y="223">R driver</text></g>
<!-- suspension arm/pivot hints -->
<g stroke="#b45309" stroke-width="4"><path d="M225 187 L201 130"/><path d="M415 187 L449 130"/><path d="M225 343 L201 400"/><path d="M415 343 L449 400"/></g>
<g fill="#f97316" stroke="#7c2d12" stroke-width="2"><circle cx="225" cy="187" r="5"/><circle cx="415" cy="187" r="5"/><circle cx="225" cy="343" r="5"/><circle cx="415" cy="343" r="5"/></g>
<text x="50" y="435" font-family="Arial" font-size="14" fill="#334155">Red blocks: motors • orange links: trailing arms • dashed purple: light electronics on upper deck above the battery</text>
<!-- dimension lines -->
<line x1="170" y1="430" x2="470" y2="430" stroke="#334155" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="284" y="424" font-family="Arial" font-size="14" fill="#334155">300 chassis length</text>
<line x1="505" y1="145" x2="505" y2="385" stroke="#334155" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="516" y="272" font-family="Arial" font-size="14" fill="#334155" transform="rotate(90 516 272)">240 chassis width</text>
<line x1="190" y1="112" x2="450" y2="112" stroke="#2563eb" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="275" y="106" font-family="Arial" font-size="13" fill="#1d4ed8">260 wheelbase</text>
<line x1="140" y1="130" x2="140" y2="400" stroke="#2563eb" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="125" y="272" font-family="Arial" font-size="13" fill="#1d4ed8" transform="rotate(-90 125 272)">270 wheel track</text>
<!-- side view -->
<text x="640" y="88" font-family="Arial" font-size="20" font-weight="bold" fill="#0f172a">SIDE VIEW • mass height</text>
<line x1="655" y1="405" x2="1030" y2="405" stroke="#64748b" stroke-width="4"/>
<rect x="700" y="245" width="280" height="22" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><text x="790" y="261" font-family="Arial" font-size="13" fill="#1e3a8a">chassis plate</text>
<!-- wheel side profiles -->
<circle cx="735" cy="370" r="35" fill="#334155" stroke="#0f172a" stroke-width="3"/><circle cx="945" cy="370" r="35" fill="#334155" stroke="#0f172a" stroke-width="3"/>
<!-- motor and battery -->
<rect x="718" y="326" width="35" height="24" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><rect x="927" y="326" width="35" height="24" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
<rect x="810" y="267" width="75" height="44" rx="5" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><text x="819" y="293" font-family="Arial" font-size="13" fill="#451a03">battery low</text>
<rect x="815" y="235" width="65" height="12" rx="3" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/><text x="886" y="245" font-family="Arial" font-size="12" fill="#5b21b6">light electronics</text>
<!-- CG -->
<circle cx="847" cy="295" r="8" fill="#dc2626" stroke="white" stroke-width="2"/><line x1="847" y1="295" x2="847" y2="405" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="855" y="325" font-family="Arial" font-size="13" fill="#991b1b">keep CG low</text>
<!-- arms/shocks -->
<path d="M735 335 L780 267" stroke="#b45309" stroke-width="6"/><path d="M760 252 L782 320" stroke="#0f766e" stroke-width="6"/><path d="M755 257 l12 4 -9 8 12 4 -9 8 12 4 -9 8" fill="none" stroke="#14b8a6" stroke-width="3"/>
<text x="670" y="440" font-family="Arial" font-size="14" fill="#334155">Battery is the main mass; put it low. Place lighter ESP32/driver boards above it, not heavy parts.</text>
<!-- legend -->
<rect x="655" y="500" width="390" height="155" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="675" y="530" font-family="Arial" font-size="17" font-weight="bold" fill="#111827">Placement key</text>
<circle cx="684" cy="558" r="8" fill="#dc2626"/><text x="702" y="563" font-family="Arial" font-size="14" fill="#334155">Estimated centre of gravity (CG) target</text>
<rect x="676" y="579" width="16" height="12" fill="#fbbf24"/><text x="702" y="590" font-family="Arial" font-size="14" fill="#334155">Battery: low and centred</text>
<rect x="676" y="606" width="16" height="12" fill="#ede9fe" stroke="#7c3aed" stroke-dasharray="3 2"/><text x="702" y="617" font-family="Arial" font-size="14" fill="#334155">Light electronics: upper deck</text>
<text x="40" y="700" font-family="Arial" font-size="14" fill="#475569">Concept drawing only. Confirm real wheel, motor, arm, shock and mounting dimensions before fabrication.</text>
</svg>


