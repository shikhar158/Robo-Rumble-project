<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Robo Rumble chassis and suspension concept</title>
<desc id="desc">Top layout of a compact four wheel rover and side section of one independent trailing arm with spring damper.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs>
<rect width="1000" height="650" fill="#f8fafc"/>
<text x="40" y="48" font-family="Arial" font-size="26" font-weight="bold" fill="#111827">Robo Rumble — concept layout (dimensions in mm)</text>
<text x="55" y="92" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">TOP VIEW</text>
<!-- wheel track horizontal 270, wheelbase 260; schematic -->
<rect x="250" y="135" width="300" height="260" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
<text x="330" y="160" font-family="Arial" font-size="16" fill="#1e3a8a">Chassis plate ~300 x 240</text>
<rect x="350" y="225" width="105" height="85" rx="8" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
<text x="365" y="260" font-family="Arial" font-size="16" fill="#451a03">3S battery</text><text x="365" y="283" font-family="Arial" font-size="14" fill="#451a03">low + centred</text>
<rect x="270" y="170" width="70" height="35" rx="4" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/><text x="276" y="193" font-family="Arial" font-size="12">ESP32</text>
<rect x="455" y="170" width="75" height="35" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><text x="460" y="193" font-family="Arial" font-size="12">Drivers</text>
<!-- wheels -->
<g fill="#374151" stroke="#111827" stroke-width="3"><rect x="180" y="155" width="55" height="85" rx="22"/><rect x="565" y="155" width="55" height="85" rx="22"/><rect x="180" y="290" width="55" height="85" rx="22"/><rect x="565" y="290" width="55" height="85" rx="22"/></g>
<g fill="#fff" font-family="Arial" font-size="13"><text x="188" y="201">wheel</text><text x="573" y="201">wheel</text><text x="188" y="337">wheel</text><text x="573" y="337">wheel</text></g>
<!-- pivot and arms -->
<g stroke="#b45309" stroke-width="5"><path d="M250 200 L218 198"/><path d="M550 200 L592 198"/><path d="M250 330 L218 332"/><path d="M550 330 L592 332"/></g>
<g fill="#f97316" stroke="#7c2d12" stroke-width="2"><circle cx="250" cy="200" r="7"/><circle cx="550" cy="200" r="7"/><circle cx="250" cy="330" r="7"/><circle cx="550" cy="330" r="7"/></g>
<text x="40" y="440" font-family="Arial" font-size="14" fill="#374151">Orange dots: arm pivots • Brown links: trailing arms • Wheel centers approx. 270 mm track × 260 mm wheelbase</text>
<line x1="250" y1="420" x2="550" y2="420" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="365" y="415" font-family="Arial" font-size="14" fill="#374151">~300 chassis length</text>
<text x="680" y="92" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">SIDE VIEW — ONE CORNER</text>
<line x1="690" y1="360" x2="950" y2="360" stroke="#64748b" stroke-width="4"/>
<rect x="710" y="180" width="220" height="55" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="755" y="213" font-family="Arial" font-size="16">Chassis rail</text>
<circle cx="755" cy="240" r="9" fill="#f97316" stroke="#7c2d12" stroke-width="2"/><text x="715" y="265" font-family="Arial" font-size="13">pivot</text>
<path d="M755 240 L865 332" stroke="#b45309" stroke-width="9"/><text x="785" y="305" font-family="Arial" font-size="13" fill="#7c2d12">trailing arm</text>
<circle cx="875" cy="325" r="38" fill="#374151" stroke="#111827" stroke-width="4"/><circle cx="875" cy="325" r="13" fill="#cbd5e1"/><text x="842" y="383" font-family="Arial" font-size="13">70 mm wheel</text>
<path d="M820 212 L840 294" stroke="#0f766e" stroke-width="8"/><path d="M813 218 l14 4 -10 10 14 4 -10 10 14 4 -10 10 14 4 -10 10 14 4" fill="none" stroke="#14b8a6" stroke-width="4"/><text x="840" y="250" font-family="Arial" font-size="13" fill="#115e59">spring/shock</text>
<path d="M860 332 L860 360 M890 332 L890 360" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="680" y="450" font-family="Arial" font-size="14" fill="#374151">Limit travel to ~15–25 mm; add a compression stop and protect flexible motor wires.</text>
<text x="40" y="570" font-family="Arial" font-size="14" fill="#475569">Concept only: verify actual motor, wheel, shock and mount dimensions before drilling or fabrication.</text>
</svg>

